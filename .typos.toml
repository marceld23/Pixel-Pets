# typos config — false-positive suppressions live here.
#
# typos has no language detection, so on a bilingual repo it flags
# common German function words ("ein", "ist", "als", "oder", …) as
# English typos. We tell it which whole words to leave alone via the
# regex below, and exclude the heaviest bilingual files entirely.

[default]
# Identifiers that should never be flagged regardless of context —
# product names, API constants, model identifiers.
extend-ignore-identifiers-re = [
  "Goo[-_]?Goo",
  "M5GO",
  "M5Burner",
  "M5StickC",
  "ax630c",
  "AX620E",
]

# German function/content words that surface in mixed-language docs
# and commit messages. Single regex with `(?i)` for case-insensitive
# matching so "Ein", "EIN", "ein" all match the same alternation.
# Anchored with ^...$ so we don't accidentally match "fein" or "deinem".
extend-ignore-words-re = [
  "(?i)^(ein|eine|einer|einem|eines|einen|der|die|das|den|dem|des|sie|er|es|ist|sind|war|wird|hat|haben|als|oder|vor|nach|unter|über|zu|zum|zur|aus|auf|aber|ach|alle|alles|am|an|denn|dort|du|für|hier|in|ja|jetzt|kein|keine|mit|mal|nicht|noch|nur|so|um|und|von|wie|wir|werden|wenn|deine|deines|deinem|deiner|dein|klick|passt|packe|modul|module|lokal|lokale|variante|adresse|explizit|hau|wahl|datei|gerät|gerate|jeder|jede|jedes|machen|machst|braucht|brauchst|sehen|siehst|nennt|nennen|tippt|tippe|geht|läuft|hat|hatte|sehen|spielen|spielt|drücke|drückt)$",
]

[files]
extend-exclude = [
  "tools/uv.lock",
  "*.bin",
  "*.deb",
  # Bilingual i18n string table — every German entry would flag.
  # Real typos in here surface as garbage on-screen, more visible
  # there than in CI.
  "src/i18n.cpp",
  # Pages site uses data-de attributes throughout — same story.
  "site/index.html",
  "site/privacy.html",
]
