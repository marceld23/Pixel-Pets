; PlatformIO config — unified for four build targets:
;   - cores3 (M5Stack CoreS3 + Module-LLM, Front-Kamera, Touch-UI)        → "Muffin"
;   - core2  (M5Stack Core2, BtnA/B/C, kein LLM, keine Kamera)            → "Goo-Goo"
;   - visu   (M5Stack CoreS3 ohne LLM-Modul, Front-Kamera, Touch-UI)      → "Visu"
;   - pip    (M5StickC Plus 2, MPU6886-IMU, BtnA/BtnB, Buzzer-only)       → "Pip"
;
; Default: cores3. Andere Targets explizit per `pio run -e <env>`.
;
; Target-Capabilities werden in src/target_caps.h aus den TARGET_*-Build-Flags
; abgeleitet — siehe dort für HAS_LLM / HAS_CAMERA / HAS_HARD_BUTTONS / etc.

[platformio]
default_envs = cores3

; ── Gemeinsame Basis ─────────────────────────────────────────────────────────
[common]
framework      = arduino
monitor_speed  = 115200
build_flags    = -DCORE_DEBUG_LEVEL=3
lib_deps_base  =
    m5stack/M5Unified
    bblanchon/ArduinoJson

; Webradio — Stream-Decoder von schreibfaul1. Wird auf cores3/core2/visu
; eingebunden, auf pip via build_src_filter -<webradio.cpp> nicht
; referenziert (Pip hat kein WiFi und keinen I2S-DAC für Streaming).
;
; Pin auf 3.0.12 (Jul 2024): die neueren Releases (3.1.0+) ziehen <span>
; und andere C++20-Features nach, der ESP32-Arduino-Toolchain fährt aber
; gcc 8.4 mit C++17. 3.0.12 läuft noch problemlos auf C++17/gnu++17.
lib_deps_wifi   =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
build_flags_wifi =
    -Wno-deprecated-declarations

; ── M5Stack CoreS3 + Module-LLM ─────────────────────────────────────────────
[env:cores3]
platform                  = espressif32
board                     = m5stack-cores3
framework                 = ${common.framework}
monitor_speed             = ${common.monitor_speed}
board_build.partitions    = partitions_cores3_16MB.csv
board_build.flash_size    = 16MB
board_upload.flash_size   = 16MB
board_upload.maximum_size = 7864320
build_flags =
    ${common.build_flags}
    ${common.build_flags_wifi}
    -DTARGET_CORES3=1
build_src_filter =
    +<*>
    -<pip/>
    -<main_pip.cpp>
lib_deps =
    ${common.lib_deps_base}
    ${common.lib_deps_wifi}
    m5stack/M5Module-LLM

; ── M5Stack Core2 (Legacy / kein LLM) ───────────────────────────────────────
[env:core2]
platform                  = espressif32
board                     = m5stack-core2
framework                 = ${common.framework}
monitor_speed             = ${common.monitor_speed}
board_build.partitions    = partitions_core2_16MB.csv
board_build.flash_size    = 16MB
board_upload.flash_size   = 16MB
board_upload.maximum_size = 8323072
build_flags =
    ${common.build_flags}
    ${common.build_flags_wifi}
    -DTARGET_CORE2=1
build_src_filter =
    +<*>
    -<voice_pipeline.cpp>
    -<face_detect.cpp>
    -<pip/>
    -<main_pip.cpp>
lib_deps =
    ${common.lib_deps_base}
    ${common.lib_deps_wifi}

; ── M5Stack CoreS3 ohne Module-LLM ──────────────────────────────────────────
; Identische Hardware wie cores3, nur ohne angeschlossenes LLM-Modul.
; Voice-Pipeline ausgeklammert, Frontkamera + Touch bleiben.
[env:visu]
platform                  = espressif32
board                     = m5stack-cores3
framework                 = ${common.framework}
monitor_speed             = ${common.monitor_speed}
board_build.partitions    = partitions_cores3_16MB.csv
board_build.flash_size    = 16MB
board_upload.flash_size   = 16MB
board_upload.maximum_size = 7864320
build_flags =
    ${common.build_flags}
    ${common.build_flags_wifi}
    -DTARGET_VISU=1
build_src_filter =
    +<*>
    -<voice_pipeline.cpp>
    -<pip/>
    -<main_pip.cpp>
lib_deps =
    ${common.lib_deps_base}
    ${common.lib_deps_wifi}

; ── M5StickC Plus 2 — minimales mobiles Pet ─────────────────────────────────
; ESP32-PICO, 135×240-Display, MPU6886, PWM-Buzzer, BtnA/BtnB. Eigene
; main_pip.cpp + pip/-Module statt der großen face/voice/sounds-Stacks.
[env:pip]
platform                  = espressif32
; PlatformIO hat (Stand 2026-04) keine eigene Board-ID für StickC Plus 2.
; Der Plus 2 ist Pin- und Speicher-mäßig kompatibel zum Plus 1, hat aber
; 8 MB Flash statt 4 MB. M5Unified erkennt den Plus 2 zur Laufzeit über
; den Stick-Boot-ROM, daher reicht es das alte Board-Profil zu nutzen
; und die Flash-Size zu überschreiben.
board                     = m5stick-c
framework                 = ${common.framework}
monitor_speed             = ${common.monitor_speed}
board_build.partitions    = partitions_pip_8MB.csv
board_build.flash_size    = 8MB
board_upload.flash_size   = 8MB
board_upload.maximum_size = 4194304
build_flags =
    ${common.build_flags}
    -DTARGET_PIP=1
build_src_filter =
    +<*>
    -<main.cpp>
    -<face.cpp>
    -<face_detect.cpp>
    -<voice_pipeline.cpp>
    -<webradio.cpp>
    -<pip_link.cpp>
    -<sounds/>
lib_deps =
    ${common.lib_deps_base}

; ── M5StickC Plus 2 (S3-Revision) ───────────────────────────────────────────
; Selbe Pet-Logik wie [env:pip], aber für den ESP32-S3-Refresh des Plus 2.
; PlatformIO hat keine dedizierte Board-ID dafür, also verwenden wir
; `m5stack-atoms3` (ebenfalls ESP32-S3, 8 MB Flash, gleiche M5-Familie) als
; Compile-Profil und lassen M5Unified zur Laufzeit das tatsächliche Gerät
; erkennen (über die RTC/IMU-Signatur).
[env:pip-s3]
platform                  = espressif32
board                     = m5stack-atoms3
framework                 = ${common.framework}
monitor_speed             = ${common.monitor_speed}
board_build.partitions    = partitions_pip_8MB.csv
board_build.flash_size    = 8MB
board_upload.flash_size   = 8MB
board_upload.maximum_size = 4194304
build_flags =
    ${common.build_flags}
    -DTARGET_PIP=1
build_src_filter =
    +<*>
    -<main.cpp>
    -<face.cpp>
    -<face_detect.cpp>
    -<voice_pipeline.cpp>
    -<webradio.cpp>
    -<pip_link.cpp>
    -<sounds/>
lib_deps =
    ${common.lib_deps_base}

; ── Screenshot variants ─────────────────────────────────────────────────────
; Eigenständige Build-Targets für Doku-Screenshots: erben jeweils von ihrem
; Produktiv-Target und schalten zusätzlich SCREENSHOT_MODE=1 ein. Ergebnis:
; ein Long-Press auf den PWR-Knopf (≥ 2 s) dumpt den aktuellen Canvas als
; base64-RGB565 über Serial. Host-Tool zum Decodieren: tools/extract_screenshots.py.
;
; Diese Envs landen NICHT in der CI-Matrix und nicht in Produktiv-Builds —
; sie sind reine Helfer für README/Doku-Bilder. Vor dem Release wieder
; auf den Produktiv-Env zurückflashen.

[env:cores3-shots]
extends                   = env:cores3
build_flags               = ${env:cores3.build_flags}
                            -DSCREENSHOT_MODE=1

[env:visu-shots]
extends                   = env:visu
build_flags               = ${env:visu.build_flags}
                            -DSCREENSHOT_MODE=1

[env:core2-shots]
extends                   = env:core2
build_flags               = ${env:core2.build_flags}
                            -DSCREENSHOT_MODE=1

; ── Native unit tests ───────────────────────────────────────────────────────
; `pio test -e native` baut die pure-Logic-Module (siehe src/needs_logic.cpp,
; in Zukunft mehr) plus Unity-Tests aus test/ auf dem Host-Compiler. Keine
; Hardware nötig, läuft in CI mit.
[env:native]
platform                  = native
test_framework            = unity
build_flags               = -std=gnu++17
                            -Wall
test_build_src            = no
