name: Release

# Two trigger paths:
#
#   1. `push: tags: v*` — real release. Builds firmware for every target,
#      merges each env's bootloader + partitions + OTA selector + app into
#      a single offset-0x0 image, and attaches the resulting
#      `pixel-pets-vX.Y.Z-<pet>.bin` files to the GitHub release for that
#      tag. Recommended workflow:
#
#          gh release create vX.Y.Z --notes "..."   # human-curates notes
#          git push origin vX.Y.Z                   # this CI runs + uploads bins
#
#   2. `workflow_dispatch` — dry run for testing the pipeline without
#      tagging. Builds + merges as normal, but instead of attaching to a
#      release, the binaries are uploaded as a workflow artifact (visible
#      to repo maintainers in the run summary, 7-day retention). Filename
#      uses `test-<short-sha>` instead of a version tag so the artifacts
#      are unmistakably non-release builds.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO + pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-release-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO + esptool
        run: pip install platformio esptool

      - name: Resolve VERSION + MODE from trigger
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=$GITHUB_REF_NAME"        >> "$GITHUB_OUTPUT"
            echo "mode=release"                    >> "$GITHUB_OUTPUT"
            echo "Triggered by tag push: $GITHUB_REF_NAME → real release upload"
          else
            echo "version=test-${GITHUB_SHA:0:7}"  >> "$GITHUB_OUTPUT"
            echo "mode=test"                       >> "$GITHUB_OUTPUT"
            echo "Triggered manually on $GITHUB_REF_NAME → artifact-only dry run"
          fi

      - name: Build firmware for every target
        run: pio run -e cores3 -e visu -e core2 -e pip -e pip-s3

      - name: Merge per-env outputs into single offset-0x0 images
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          MODE: ${{ steps.meta.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p release-bins

          # boot_app0.bin (the OTA selector pointing at slot 0) ships with
          # the Arduino-ESP32 framework — find it once and reuse.
          BOOT_APP0=$(ls ~/.platformio/packages/framework-arduinoespressif32*/tools/partitions/boot_app0.bin 2>/dev/null | head -1)
          if [ -z "$BOOT_APP0" ]; then
            echo "::error::boot_app0.bin not found under framework-arduinoespressif32*"
            exit 1
          fi
          echo "Using boot_app0: $BOOT_APP0"

          # Per-env metadata. Bootloader on ESP32 sits at 0x1000; on
          # ESP32-S2 / S3 at 0x0. Friendly names are the user-facing pet
          # branding the README uses.
          declare -A CHIP=( [cores3]=esp32s3 [visu]=esp32s3 [core2]=esp32 [pip]=esp32 [pip-s3]=esp32s3 )
          declare -A NAME=( [cores3]=muffin   [visu]=visu    [core2]=goo-goo [pip]=pip   [pip-s3]=pip-s3 )

          for env in cores3 visu core2 pip pip-s3; do
            chip=${CHIP[$env]}
            friendly=${NAME[$env]}
            offset=$([ "$chip" = esp32 ] && echo 0x1000 || echo 0x0)
            out="release-bins/pixel-pets-${VERSION}-${friendly}.bin"
            echo "::group::Merge $env ($chip) -> $out"
            python3 -m esptool --chip "$chip" merge_bin \
              -o "$out" \
              --flash_mode dio --flash_freq 80m --flash_size keep \
              "$offset" ".pio/build/$env/bootloader.bin" \
              0x8000  ".pio/build/$env/partitions.bin" \
              0xe000  "$BOOT_APP0" \
              0x10000 ".pio/build/$env/firmware.bin"
            echo "::endgroup::"
          done

          echo
          echo "Final assets ($MODE mode, version=$VERSION):"
          ls -lh release-bins/

      - name: Attach binaries to the release  (tag push only)
        if: steps.meta.outputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-bins/*.bin
          fail_on_unmatched_files: true

      - name: Upload binaries as workflow artifact  (manual dry run only)
        if: steps.meta.outputs.mode == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: pixel-pets-firmware-${{ steps.meta.outputs.version }}
          path: release-bins/*.bin
          retention-days: 7
          if-no-files-found: error
