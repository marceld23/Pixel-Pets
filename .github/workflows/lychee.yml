name: Link check

# Monthly link health check via lychee. Scans every .md and the Pages
# site HTML for broken external links (404, DNS failures, cert errors).
# Catches the silent rot in third-party URLs — M5Stack store pages,
# Hackster.io, image badges, doc references — that nobody notices
# manually.
#
# Runs the 1st of each month, plus on-demand via workflow_dispatch.
# Doesn't run on every push: link rot is slow, and external services
# occasionally 503 transiently — running monthly avoids false alarms.

on:
  schedule:
    - cron: '17 6 1 * *'       # 1st of each month, 06:17 UTC
  workflow_dispatch:
  # Also run when the link-check setup itself changes, so we notice
  # right away if a config tweak breaks scanning.
  push:
    paths:
      - '.github/workflows/lychee.yml'
      - 'lychee.toml'

permissions:
  contents: read
  issues: write    # so the action can open an issue when links break

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Restore lychee cache (avoids re-checking unchanged URLs)
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # `--no-progress` keeps the log readable; `--cache` reuses the
          # restored .lycheecache to skip unchanged URLs across runs.
          # Mail (mailto:) is excluded by default since lychee 0.18 —
          # the old `--exclude-mail` flag was removed and crashes the
          # CLI if passed. Excluded patterns: mDNS-local hostnames the
          # pet exposes (won't resolve from the runner), and the
          # YouTube thumbnail URLs which sometimes 503 transiently.
          args: |
            --verbose
            --no-progress
            --cache
            --max-cache-age 7d
            --exclude '^https://[^/]*-setup\.local'
            --exclude '^https://img\.youtube\.com'
            './**/*.md'
            './site/**/*.html'
          fail: false
          format: markdown
          output: lychee-report.md

      # Defensive guard: only open an issue if lychee actually wrote a
      # non-empty report. A non-zero exit alone isn't enough — if the
      # CLI itself crashes (bad flag, network failure before any check
      # ran) the report file stays empty / missing and the issue body
      # would be useless. Without this guard a single config typo
      # spams the tracker with empty "Link check found broken URLs"
      # issues (cf. #2 / #8–#13 from the initial wiring).
      - name: Confirm report is non-empty
        id: report
        if: steps.lychee.outputs.exit_code != 0
        run: |
          if [ -s lychee-report.md ]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::lychee exited non-zero but produced no report — likely a CLI / config error, not a real broken link. Check the run log."
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open / update issue when links are broken
        if: steps.report.outputs.has_findings == 'true'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Link check found broken URLs"
          content-filepath: lychee-report.md
          labels: |
            bug
            link-rot
